# ==============================================================================
# ThinStation 7.2 build.conf
# Оптимизированный профиль тонкого клиента для VMware / Omnissa Horizon
# Сервер: vdi.dnestrschool1.online
# Оборудование: Intel NUC7i5BNB, x86_64 ПК и ноутбуки (Intel, AMD, Realtek)
# ==============================================================================

# --- Модули ядра (Файловые системы и накопители) ---
module loop                  # Поддержка Loop-устройств
module squashfs              # Поддержка файловой системы SquashFS
module overlay               # Поддержка файловой системы OverlayFS
module ext4                  # Поддержка файловой системы Ext4
module vfat                  # Поддержка FAT/VFAT (USB-флешки и EFI-разделы)
module isofs                 # Поддержка ISO9660 для CD-ROM / Live-образов
module udf                   # Формат UDF для DVD/CD
module fuse                  # Файловые системы в пространстве пользователя (FUSE)
module fuse3                 # FUSE версии 3
module usb-storage           # Драйвер USB флеш-накопителей
module uas                   # Драйвер USB Attached SCSI (для скоростных USB 3.0 флешек)
module sd_mod                # Драйвер SCSI/SATA/USB дисков
module sr_mod                # Драйвер оптических приводов CD/DVD
module ahci                  # Контроллеры SATA AHCI
module nvme                  # Скоростные накопители NVMe SSD

# --- Сетевые драйверы (Проводной Ethernet) ---
module e1000e                # Intel Gigabit Ethernet (Intel NUC7i5BNB: I219-V, I217, I218)
module igc                   # Intel 2.5GbE Ethernet (I225 / I226)
module igb                   # Intel Gigabit PCIe (I210, I211, I350 - частый на десктопах)
module e1000                 # Intel Gigabit (классические адаптеры 8254x)
module e100                  # Intel PRO/100 Ethernet
module ixgbe                 # Intel 10 Gigabit PCI Express
module i40e                  # Intel 40 Gigabit / Ethernet Controller XL710
module r8169                 # Realtek PCIe Gigabit / 2.5G Ethernet (RTL8111, RTL8168, RTL8125)
module r8168                 # Realtek RTL8168 standalone
module r8125                 # Realtek RTL8125 2.5G standalone
module 8139too               # Realtek RTL8139 Fast Ethernet
module 8139cp                # Realtek RTL8139 C+ Fast Ethernet
module r8152                 # Realtek USB 3.0 / Gigabit Ethernet адаптеры
module asix                  # ASIX USB 2.0 Ethernet адаптеры
module ax88179_178a          # ASIX USB 3.0 Gigabit Ethernet адаптеры
module cdc_ether             # Стандартный USB CDC Ethernet (USB-C док-станции и адаптеры)
module cdc_ncm               # USB CDC NCM Ethernet адаптеры
module cdc_mbim              # USB CDC MBIM
module tg3                   # Broadcom Tigon3 Gigabit Ethernet
module bnx2                  # Broadcom NetXtreme II 1GbE
module bnx2x                 # Broadcom NetXtreme II 10GbE
module alx                   # Qualcomm Atheros AR8161/AR8171/Killer Gigabit Ethernet
module atlantic              # Aquantia AQtion 10G / 5G / 2.5G Ethernet
module sky2                  # Marvell Yukon 2 Gigabit Ethernet
module forcedeth             # NVIDIA nForce MCP Ethernet
module via-rhine             # VIA Rhine Fast Ethernet
module via-velocity          # VIA Velocity Gigabit Ethernet
module jme                   # JMicron PCIe Gigabit Ethernet
module vmxnet3               # Виртуальный сетевой адаптер VMware
module virtio_net            # Виртуальный сетевой адаптер KVM / Proxmox / QEMU

# --- Беспроводная подсистема ядра (Wi-Fi Core & Stack) ---
module cfg80211              # Ядро беспроводной подсистемы Linux
module mac80211              # Стек 802.11
module rfkill                # Управление радиомодулями (кнопки Wi-Fi)
module libarc4               # Алгоритм шифрования ARC4 (WPA/WEP)

# --- Беспроводные драйверы (Wi-Fi адаптеры для ноутбуков и ПК) ---
module iwlwifi               # Intel Wireless Wi-Fi (Intel AC 8265, AX200, AX210 и др.)
module iwlmvm                # Модуль mac80211 для современных карт Intel Wi-Fi
module iwldvm                # Модуль mac80211 для старых карт Intel (Centrino, 6000-серия)
module rtw88_pci             # Realtek 802.11ac PCIe Wi-Fi (основа)
module rtw88_8821ce          # Realtek RTL8821CE (очень распространен в ноутбуках HP/Lenovo/Asus)
module rtw88_8822ce          # Realtek RTL8822CE
module rtw88_8723de          # Realtek RTL8723DE
module rtw88_8822be          # Realtek RTL8822BE
module rtw89_pci             # Realtek Wi-Fi 6 PCIe (RTL8852AE, RTL8852BE, RTL8852CE)
module rtw89_8852ae          # Realtek RTL8852AE
module rtw89_8852be          # Realtek RTL8852BE
module rtw89_8852ce          # Realtek RTL8852CE
module rtw89_core            # Базовое ядро rtw89
module ath9k                 # Qualcomm Atheros 802.11n Wi-Fi
module ath10k_core           # Qualcomm Atheros 802.11ac Core
module ath10k_pci            # Qualcomm Atheros 802.11ac Wi-Fi
module ath11k                # Qualcomm Atheros Wi-Fi 6 Core
module ath11k_pci            # Qualcomm Atheros Wi-Fi 6 PCIe
module mt76                  # MediaTek 802.11 Core
module mt7921_common         # MediaTek Wi-Fi 6 Common
module mt7921e               # MediaTek Wi-Fi 6 PCIe (в современных ноутбуках ASUS/Lenovo)
module mt76x2e               # MediaTek 802.11ac Wi-Fi
module brcmfmac              # Broadcom FullMAC Wi-Fi
module brcmsmac              # Broadcom PCIe Wi-Fi
module b43                   # Broadcom legacy Wi-Fi
module rtl8192ce             # Realtek RTL8192CE PCIe
module rtl8192de             # Realtek RTL8192DE PCIe
module rtl8192ee             # Realtek RTL8192EE PCIe
module rtl8723ae             # Realtek RTL8723AE PCIe
module rtl8723be             # Realtek RTL8723BE PCIe
module rtl8821ae             # Realtek RTL8821AE PCIe
module r8188eu               # Realtek RTL8188EU USB Wi-Fi адаптеры
module rtl8xxxu              # Универсальный драйвер для Realtek USB Wi-Fi
module mwifiex_pcie          # Marvell / NXP Wi-Fi PCIe

# --- Драйверы тачпада и устройств ввода (Ноутбуки) ---
module psmouse               # Классические тачпады PS/2 (Synaptics, ALPS, Elantech)
module hid-multitouch        # Современные Precision тачпады (I2C/USB Multitouch)
module i2c-hid               # Подсистема I2C HID
module i2c-hid-acpi          # Тачпады I2C HID ACPI (современные ноутбуки с 2016 г.)
module i2c-designware-platform # Контроллер I2C Synopsys DesignWare (ноутбуки Intel/AMD)
module i2c-designware-core
module intel-lpss-pci        # Контроллер Intel LPSS (шина I2C тачпада на Intel CPU)
module intel-lpss
module i2c-i801              # Контроллер Intel SMBus (Synaptics RMI4)
module elan_i2c              # Тачпады Elantech I2C (ноутбуки ASUS, Acer, Lenovo, HP)
module rmi_core              # Тачпады Synaptics RMI4
module rmi_i2c
module rmi_smbus

# --- Базовые системные пакеты ---
package base                 # Базовая подсистема ThinStation и скрипты инициализации
package ca-certificates      # Доверенные корневые сертификаты SSL (Let's Encrypt и др.)

# --- Модули звука ---
module snd-hda-intel         # Звуковые контроллеры Intel HD Audio / Realtek ALC
module snd-usb-audio         # Поддержка USB-гарнитур и внешней акустики

# --- Звуковая подсистема (пользовательское пространство) ---
package alsa                 # Драйверы звука ALSA
package pipewire             # Современный аудиосервер PipeWire
package xfce4-pulseaudio-plugin # Регулятор громкости в системном трее

# --- Сетевая подсистема с поддержкой Wi-Fi и GUI апплетом выбора сетей ---
package networkmanager       # Служба NetworkManager + nm-applet в системном трее
package wireless             # Утилиты управления беспроводными соединениями (iw, wireless-tools)
package wpa_supplicant       # Поддержка шифрования WPA/WPA2/WPA3 и 802.1X

# --- Клиент VDI: Omnissa / VMware Horizon ---
package horizon              # Нативный клиент Omnissa Horizon (Blast / PCoIP)

# --- Драйверы виртуализации (для тестирования на виртуалках) ---
package open-vm-tools        # VMware Tools
package vboxguest            # VirtualBox Guest Additions

# --- Локализация ---
package locale-en_US         # Английская локаль
package locale-ru_RU         # Русская локаль

# --- Графика X.Org, устройства ввода и видеодрайверы ---
package xorg7                # Сервер X.Org и базовые KMS-драйверы
package xorg7-xinput         # Драйвер libinput для тачпадов и сенсорных панелей в X.Org
package xorg7-intel          # Видеодрайверы Intel HD / Iris Plus Graphics (Intel NUC: Iris 640)
package xorg7-amdgpu         # Видеодрайверы AMD Radeon
package xorg7-ati            # Видеодрайверы для старых видеокарт ATI
package xorg7-nouveau        # Открытый видеодрайвер NVIDIA
package xorg7-vmware         # Видеодрайвер VMware SVGA
package xorg7-qxl            # Видеодрайвер QEMU / KVM QXL

# --- Дисплейный менеджер, D-Bus и оконный интерфейс ---
package lightdm              # Дисплейный менеджер для графического входа (сессия tsuser)
package dbus                 # Системная шина D-Bus (требуется для Horizon Client и апплетов)
package xfwm4                # Легковесный оконный менеджер и панель XFCE
package terminal             # Эмулятор терминала
package fonts-TTF-liberation # Шрифты Liberation TrueType
package fonts-TTF-noto       # Шрифты Google Noto с поддержкой кириллицы
package icons-cursor         # Темы курсоров
package icons-adwaita        # Набор иконок Adwaita
package gtk-theme-adwaita    # Тема оформления Adwaita GTK

# --- Системные утилиты ---
package usbutils             # Утилиты lsusb для диагностики USB
package pciutils             # Утилиты lspci для диагностики оборудования

# --- Параметры сжатия образа и ядра ---
param fastboot       lotsofmem
param squashopt      "-comp xz"
param initrdcmd      "xz"
param bootlogo       false
param kernelcmdline  "selinux=0"
param allfirmware    true
param earlymicrocode true
param blacklist      "snd-pcsp.ko pcspkr.ko"

# --- Параметры сборки загрузчика ---
param grubtheme      "default"
param defaultconfig  thinstation.conf.buildtime
param basename       thinstation
param basepath       ts7.2
param hardlinkfs     true
param sametimestmp   true
param haltonerror    false
param bootverbosity  3
param bootimages     grub
param cdvolname      THINSTATION
