# ==============================================================================
# ThinStation 7.2 build.conf
# Оптимизированный профиль тонкого клиента для VMware / Omnissa Horizon
# Сервер: vdi.dnestrschool1.online
# ==============================================================================

# --- Модули ядра (Файловые системы и накопители) ---
module ext4                  # Поддержка файловой системы Ext4
module vfat                  # Поддержка FAT/VFAT (USB-флешки)
module isofs                 # Поддержка ISO9660 для CD-ROM / Live-образов
module udf                   # Формат UDF для DVD/CD
module fuse                  # Файловые системы в пространстве пользователя (FUSE)
module fuse3                 # FUSE версии 3
module usb-storage           # Драйвер USB флеш-накопителей
module sd_mod                # Драйвер SCSI/SATA дисков
module ahci                  # Контроллеры SATA AHCI

# --- Звуковая подсистема ---
package alsa                 # Драйверы звука ALSA
package pipewire             # Современный аудиосервер PipeWire
package xfce4-pulseaudio-plugin # Регулятор громкости в системном трее

# --- Сеть ---
package autonet              # Автоматическая настройка сети через DHCP

# --- Клиент VDI: Omnissa / VMware Horizon ---
package horizon              # Нативный клиент Omnissa Horizon (Blast / PCoIP)

# --- Драйверы виртуализации (для тестирования на виртуалках) ---
package open-vm-tools        # VMware Tools
package vboxguest            # VirtualBox Guest Additions

# --- Локализация ---
package locale-en_US         # Английская локаль
package locale-ru_RU         # Русская локаль

# --- Графика X.Org и видеодрайверы ---
package xorg7                # Сервер X.Org и базовые KMS-драйверы
package xorg7-intel          # Видеодрайверы Intel HD / UHD Graphics
package xorg7-amdgpu         # Видеодрайверы AMD Radeon
package xorg7-ati            # Видеодрайверы для старых видеокарт ATI
package xorg7-nouveau        # Открытый видеодрайвер NVIDIA
package xorg7-vmware         # Видеодрайвер VMware SVGA
package xorg7-qxl            # Видеодрайвер QEMU / KVM QXL

# --- Оконный менеджер и интерфейс ---
package xfwm4                # Легковесный оконный менеджер XFCE
package terminal             # Эмулятор терминала
package fonts-TTF-liberation # Шрифты Liberation TrueType
package fonts-TTF-noto       # Шрифты Google Noto с поддержкой кириллицы
package icons-cursor         # Темы курсоров
package icons-adwaita        # Набор иконок Adwaita
package gtk-theme-adwaita    # Тема оформления Adwaita GTK

# --- Системные утилиты ---
package usbutils             # Утилиты lsusb для диагностики USB
package pciutils             # Утилиты lspci для диагностики оборудования

# --- Параметры сборки загрузчика ---
param grubtheme "default"
param defaultconfig thinstation.conf.buildtime
param basename thinstation
param basepath ts7.2
param hardlinkfs true
param ts_bootimages grub
param ts_cdvolname THINSTATION
