# ==============================================================================
# ThinStation 6.2 build.conf
# Профиль тонкого клиента для VMware Horizon (пакет vmview)
# Сервер: vdi.dnestrschool1.online
# ==============================================================================

# --- Модули ядра ---
module loop
module squashfs
module overlay
module ext4
module vfat
module isofs
module udf
module fuse
module usb-storage
module uas
module sd_mod
module ahci
module nvme
module e1000e
module e1000
module igb
module igc
module r8169
module r8152
module asix
module ax88179_178a
module tg3
module alx
module vmxnet3
module virtio_net

# --- Беспроводная подсистема Wi-Fi ---
module cfg80211
module mac80211
module rfkill
module iwlwifi
module iwlmvm
module iwldvm
module rtw88_pci
module rtw88_8821ce
module rtw88_8822ce
module ath9k
module ath10k_pci

# --- Базовые пакеты и SSL ---
package ca-certificates

# --- Звуковая подсистема ---
package alsa
package pulseaudio

# --- Сеть и Wi-Fi ---
package networkmanager
package wireless
package wpa_supplicant

# --- Клиент VDI: VMware View ---
package vmview               # VMware Horizon Client (PCoIP / Blast)

# --- Драйверы виртуализации ---
package open-vm-tools
package vboxguest

# --- Локализация ---
package locale-en_US
package locale-ru_RU

# --- Графика X.Org и видеодрайверы ---
package xorg7
package xorg7-intel
package xorg7-amdgpu
package xorg7-ati
package xorg7-nouveau
package xorg7-vmware
package xorg7-qxl

# --- Оконный менеджер и интерфейс ---
package xfwm4
package terminal
package fonts-TTF-liberation
package fonts-TTF-noto
package icons-cursor
package icons-adwaita
package gtk-theme-adwaita

# --- Системные утилиты ---
package usbutils
package pciutils

# --- Параметры сборки ---
param initrdcmd "gzip"
param allfirmware true
param defaultconfig thinstation.conf.buildtime
param basename thinstation
param basepath ts6.2
param hardlinkfs true
param ts_bootimages syslinux
param ts_cdvolname THINSTATION
